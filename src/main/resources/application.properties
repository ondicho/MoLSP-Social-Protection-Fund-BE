spring.application.name=Social-Assistance-Fund
spring.config.import=classpath:geography.yml
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/social_assistance_fund}
spring.datasource.username=${DB_USER:saf}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.phone.default-region=${PHONE_DEFAULT_REGION:KE}
app.phone.allowed-country-codes=${PHONE_ALLOWED_COUNTRY_CODES:254}
app.bootstrap-admin.first-name=${PLATFORM_ADMIN_FIRST_NAME:}
app.bootstrap-admin.last-name=${PLATFORM_ADMIN_LAST_NAME:}
app.bootstrap-admin.email=${PLATFORM_ADMIN_EMAIL:}
app.bootstrap-admin.password=${PLATFORM_ADMIN_PASSWORD:}
spring.jpa.show-sql=false
spring.mvc.log-request-details=false
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cors.paths=${CORS_PATHS:/**}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Request-ID}
app.cors.exposed-headers=${CORS_EXPOSED_HEADERS:X-Request-ID}
app.cors.max-age=${CORS_MAX_AGE:3600}

management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.metrics.access=read-only
management.endpoint.heapdump.access=none
management.endpoints.web.exposure.include=health
management.endpoints.web.exposure.exclude=heapdump,env,configprops,threaddump,logfile,loggers
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Notifications: transactional outbox + optional provider. Blank COMMS_* values leave no gateway loaded;
# notifications then stay queued in the outbox and are drained once a provider is configured.
app.notifications.provider=${COMMS_PROVIDER:techvoyage}
app.notifications.message-title=${COMMS_MESSAGE_TITLE:Social Assistance Fund}
app.notifications.ministry-name=${COMMS_MINISTRY_NAME:Ministry of Labour and Social Protection}
app.notifications.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:8}
app.notifications.retry-base-delay=${NOTIFICATION_RETRY_BASE_DELAY:PT30S}
app.notifications.retry-max-delay=${NOTIFICATION_RETRY_MAX_DELAY:PT1H}
app.notifications.lease=${NOTIFICATION_LEASE:PT2M}
app.notifications.batch-size=${NOTIFICATION_BATCH_SIZE:20}
app.notifications.poll-interval=${NOTIFICATION_POLL_INTERVAL:PT30S}
app.notifications.poll-initial-delay=${NOTIFICATION_POLL_INITIAL_DELAY:PT20S}
app.notifications.techvoyage.auth-url=${COMMS_AUTH_URL:}
app.notifications.techvoyage.send-url=${COMMS_SEND_URL:}
app.notifications.techvoyage.username=${COMMS_USERNAME:}
app.notifications.techvoyage.password=${COMMS_PASSWORD:}
app.notifications.techvoyage.connect-timeout=${COMMS_CONNECT_TIMEOUT:PT5S}
app.notifications.techvoyage.read-timeout=${COMMS_READ_TIMEOUT:PT10S}
app.notifications.techvoyage.token-ttl=${COMMS_TOKEN_TTL:PT10M}
