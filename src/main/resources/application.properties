spring.application.name=Social-Assistance-Fund
spring.config.import=classpath:geography.yml
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/social_assistance_fund}
spring.datasource.username=${DB_USER:saf}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.phone.default-region=${PHONE_DEFAULT_REGION:KE}
app.phone.allowed-country-codes=${PHONE_ALLOWED_COUNTRY_CODES:254}
spring.jpa.show-sql=false
spring.mvc.log-request-details=false
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cors.paths=${CORS_PATHS:/**}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Request-ID}
app.cors.exposed-headers=${CORS_EXPOSED_HEADERS:X-Request-ID}
app.cors.max-age=${CORS_MAX_AGE:3600}

management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.metrics.access=read-only
management.endpoint.heapdump.access=none
management.endpoints.web.exposure.include=health
management.endpoints.web.exposure.exclude=heapdump,env,configprops,threaddump,logfile,loggers
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
