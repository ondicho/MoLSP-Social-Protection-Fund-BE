  ward-data-source:
    description: Ward assignments are taken from the hci database station table and linked by station.subcounty_id to subcounties.subcounty_id.
      These constituency-based units are kept separate from the provisional 2009/2019 census sub-counties because their names
      and boundaries do not consistently match.
    database: hci
    tables:
      - counties
      - subcounties
      - station
    note: An empty wards list means no station rows were linked to that subcounty_id in the supplied export; it does not prove
      the subcounty has no wards.
